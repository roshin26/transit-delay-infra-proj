{% load static %}
<!-- ==========================================================================
     Header Component (templates/includes/header.html)
     Dark top bar with transit logo, title, navigation links, and live feed pill
     ========================================================================== -->
<header class="app-header navbar navbar-expand-lg">
  <div class="container-xl">
    <!-- Brand Lockup -->
    <a class="navbar-brand" href="#" aria-label="Dublin Transit Delay Tracker Homepage">
      <img src="{% static 'images/logo.svg' %}" alt="" class="brand-logo" width="28" height="28" aria-hidden="true" />
      <span>Dublin Transit Delay Tracker</span>
    </a>

    <!-- Mobile Menu Toggle Button -->
    <button 
      class="navbar-toggler navbar-toggler-dark d-lg-none" 
      type="button" 
      id="mobileNavToggle"
      aria-controls="navbarTransitNav" 
      aria-expanded="false" 
      aria-label="Toggle navigation menu"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>

    <!-- Nav Links & Status Pill (Collapsible on Mobile) -->
    <div class="collapse navbar-collapse" id="navbarTransitNav">
      <nav class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3" aria-label="Primary navigation">
        <a class="nav-link" href="{% url 'home' %}" aria-current="page">Live</a>
        <a class="nav-link" href="{% url 'routes' %}">Routes</a>
        <a class="nav-link" href="{% url 'status' %}">System status</a>
      </nav>

      <!-- Right Action / Feed Updated Status Pill -->
      <div class="d-flex align-items-center py-2 py-lg-0">
        <!-- DATA: Feed last updated timestamp/delta -->
        <div class="feed-status-pill" role="status" aria-live="polite">
          <span class="feed-pulse-dot" aria-hidden="true"></span>
          <span>Feed updated <span class="feed-seconds-count">38</span>s ago</span>
        </div>
      </div>
    </div>
  </div>
</header>
